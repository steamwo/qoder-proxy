name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-artifacts:
    name: Cleanup artifacts older than 6 hours
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cutoff="$(date -u -d '6 hours ago' +%s)"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .created_at, .name] | @tsv' |
          while IFS=$'\t' read -r id created_at name; do
            created_epoch="$(date -u -d "$created_at" +%s)"
            if [ "$created_epoch" -lt "$cutoff" ]; then
              echo "Deleting ${name} (${id}, ${created_at})"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            fi
          done

  quality:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test all packages
        run: go test ./...

      - name: Vet all packages
        run: go vet ./...

  release-context:
    name: Prepare release
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: write
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Detect release tag
        id: detect
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag=""
          source="none"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            source="tag"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            first_line="${HEAD_MESSAGE%%$'\n'*}"
            if [[ "$first_line" == release:\ v* ]]; then
              tag="${first_line#release: }"
              source="main"
            fi
          fi

          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          if [[ -n "$tag" ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        if: steps.detect.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
          RELEASE_SOURCE: ${{ steps.detect.outputs.source }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi

          if [[ "$RELEASE_SOURCE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
          else
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes
          fi

  windows:
    name: Build Windows desktop
    runs-on: windows-latest
    needs: [quality, release-context]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build GUI executable
        shell: pwsh
        run: ./scripts/build-desktop.ps1

      - name: Build headless proxy executable
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w" -o dist/qoder-proxy-headless-windows-amd64.exe ./cmd/qoder-proxy

      - name: Build lightweight service executable
        shell: pwsh
        run: go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/qoder-proxy-service-windows-amd64.exe ./cmd/qoder-proxy-service

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoder-proxy-windows-${{ github.sha }}
          path: |
            dist/qoder-proxy-desktop-windows-amd64.exe
            dist/qoder-proxy-headless-windows-amd64.exe
            dist/qoder-proxy-service-windows-amd64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows binaries to draft release
        if: needs.release-context.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" -R "$env:GITHUB_REPOSITORY" `
            dist/qoder-proxy-desktop-windows-amd64.exe `
            dist/qoder-proxy-headless-windows-amd64.exe `
            dist/qoder-proxy-service-windows-amd64.exe `
            --clobber

  linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest
    needs: [quality, release-context]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Gio desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev

      - name: Build Linux desktop executable
        run: ./scripts/build-desktop.sh

      - name: Build Linux lightweight service executable
        run: go build -trimpath -ldflags="-s -w" -o dist/qoder-proxy-service-linux-amd64 ./cmd/qoder-proxy-service

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoder-proxy-linux-${{ github.sha }}
          path: |
            dist/qoder-proxy-desktop-linux-amd64
            dist/qoder-proxy-service-linux-amd64
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux binaries to draft release
        if: needs.release-context.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            dist/qoder-proxy-desktop-linux-amd64 \
            dist/qoder-proxy-service-linux-amd64 \
            --clobber

  release:
    name: Publish release
    if: needs.release-context.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    needs: [release-context, windows, linux]
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
