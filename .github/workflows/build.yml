name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-win64:
    name: Build Windows x64 server
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build lightweight server executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/qoder-proxy-server-windows-amd64.exe ./cmd/qoder-proxy-service

      - name: Publish temporary Windows server release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tag = "pr-11-win64"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes
          }
          gh release create $tag dist/qoder-proxy-server-windows-amd64.exe --target $env:HEAD_SHA --title "PR #11 Win64 server" --prerelease --notes "Temporary test build for PR #11."
