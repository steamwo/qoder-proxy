name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test all packages
        run: go test ./...

      - name: Vet all packages
        run: go vet ./...

  windows:
    name: Build Windows desktop
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build GUI executable
        shell: pwsh
        run: ./scripts/build-desktop.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoder-proxy-windows-amd64
          path: dist/qoder-proxy-desktop-windows-amd64.exe
          if-no-files-found: error

  linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Gio desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev \
            libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev

      - name: Build Linux executable
        run: ./scripts/build-desktop.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoder-proxy-linux-amd64
          path: dist/qoder-proxy-desktop-linux-amd64
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, linux]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # A tag is the explicit release boundary; branch builds remain downloadable workflow artifacts.
      # 标签是明确的发布边界；分支构建仅作为可下载的工作流产物保留。
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag
